name: easespotter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0
  mobile_scanner: ^7.4.2
  url_launcher: ^6.3.3
  camera: ^0.12.1
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  #google_ml_kit: ^0.20.0
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  characters: ^1.4.1
  font_awesome_flutter: ^11.0.0
  google_mlkit_commons: ^0.13.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  app_links: ^7.2.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  flutter_staggered_grid_view: ^0.7.0
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.2
  shimmer: ^4.0.0
  video_player: ^2.14.1



  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  http: ^1.6.0
  uuid: ^4.6.0
  flutter_avif: ^3.1.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  cloud_functions: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/easespotter.png
    - assets/images/Intro.png
    - assets/images/google_g_logo.png
    - assets/models/
